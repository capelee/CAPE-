    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <title>Cape Lee 作品</title>
    <script>
      (function() {
        var currentFetch = window.fetch;
        function patch(obj) {
          try {
            Object.defineProperty(obj, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
            return true;
          } catch (e) {
            return false;
          }
        }
        try {
          delete window.fetch;
        } catch(e) {}
        if (!patch(window)) {
          patch(Window.prototype);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
