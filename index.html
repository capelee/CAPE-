<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?sz=w128&id=18ega279ty4XVeShySlEkSzJXUz2pOcep" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    
    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <title>Cape Lee 作品</title>
    <script>
      (function() {
        var currentFetch = window.fetch;
        function patch(obj) {
          try {
            Object.defineProperty(obj, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
            return true;
          } catch (e) {
            return false;
          }
        }
        try {
          delete window.fetch;
        } catch(e) {}
        if (!patch(window)) {
          patch(Window.prototype);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
